name: Build Sn0wpart Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos and iOS SDK
      uses: upm-center/theos-action@v1
      with:
        theos-src: https://github.com
        theos-sdk: https://github.com
        sdk-version: 14.5

    - name: Build Package
      run: |
        make package FINALPACKAGE=1
        
    - name: Upload Finished Tweak (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: Sn0wpart-Debian-Package
        path: packages/*.deb
