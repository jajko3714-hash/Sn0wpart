name: Build Sn0wpart Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos and SDKs
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl git libssl-dev fakeroot xz-utils wget
        # Use the official automated install installer straight from the team
        bash -c "$(wget -qO- https://githubusercontent.com)"
        echo "THEOS=/opt/theos" >> $GITHUB_ENV

    - name: Build Tweak Package
      run: |
        export THEOS=/opt/theos
        make package FINALPACKAGE=1
        
    - name: Upload Finished Tweak (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: Sn0wpart-Debian-Package
        path: packages/*.deb
