name: Build Sn0wpart Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos and SDKs
      uses: beerpiss/theos-action@v1

    - name: Build Package
      run: |
        make package FINALPACKAGE=1
        
    - name: Upload Finished Tweak (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: Sn0wpart-Debian-Package
        path: packages/*.deb
