name: Build Sn0wpart Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl git libssl-dev fakeroot
        git clone --recursive https://github.com $HOME/theos

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        curl -L https://github.com -o $HOME/theos/sdks/iPhoneOS14.5.sdk.tar.xz
        tar -xf $HOME/theos/sdks/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
        rm $HOME/theos/sdks/iPhoneOS14.5.sdk.tar.xz
        
    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1
        
    - name: Upload Finished Tweak (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: Sn0wpart-Debian-Package
        path: packages/*.deb
