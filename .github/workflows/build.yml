name: Build Sn0wpart Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos Suite
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        ref: master
        path: theos
        submodules: recursive

    - name: Set up Light SDK
      run: |
        mkdir -p theos/sdks
        # Fetch directly from the real Releases storage link
        curl -L "https://github.com" -o theos/sdks/iPhoneOS14.5.sdk.tar.xz
        tar -xf theos/sdks/iPhoneOS14.5.sdk.tar.xz -C theos/sdks/
        rm theos/sdks/iPhoneOS14.5.sdk.tar.xz

    - name: Download Precompiled Linux Toolchain
      run: |
        mkdir -p theos/toolchain/linux/iphone
        curl -L "https://github.com" -o toolchain.tar.lzma
        tar --lzma -xf toolchain.tar.lzma -C theos/toolchain/linux/iphone/ --strip-components=1
        rm toolchain.tar.lzma

    - name: Build Tweak Package
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        make package FINALPACKAGE=1
        
    - name: Upload Finished Tweak (.deb)
      uses: actions/upload-artifact@v4
      with:
        name: Sn0wpart-Debian-Package
        path: packages/*.deb
